# ----------------------------
# Configuration Générale
# ----------------------------
server.address=0.0.0.0
server.port=9090

spring.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE

# Tâches Asynchrones
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# Session
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# ----------------------------
# Base de Données
# ----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/mylbdb?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ----------------------------
# SMTP Gmail
# ----------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mylbmakeyoulifebetter@gmail.com
spring.mail.password=rafz anxq sqjl defn

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=true
app.mail.sender-address=${spring.mail.username}

# ----------------------------
# Encodage
# ----------------------------
spring.mandatory-file-encoding=UTF-8
spring.mail.properties.mail.mime.charset=UTF-8

# ----------------------------
# Upload Fichiers
# ----------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Endpoints
management.endpoints.web.exposure.include=mappings
