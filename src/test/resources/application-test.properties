# ============================================
# CONFIGURATION BASE DE DONNÉES DE TEST (H2)
# ============================================

# Base de données H2 en mémoire - COMPLÈTEMENT ISOLÉE
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# CONFIGURATION JPA/HIBERNATE
# ============================================

# Dialect H2 pour Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Recréer les tables à chaque test - BASE TEMPORAIRE
spring.jpa.hibernate.ddl-auto=create-drop

# Afficher les requêtes SQL dans les logs (utile pour debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONFIGURATION H2 CONSOLE (OPTIONNEL)
# ============================================

# Activer la console web H2 (accessible via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# CONFIGURATION LOGGING
# ============================================

# Logs détaillés pour le débogage
logging.level.com.MyLb.BackEnd=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CONFIGURATION SPRING SPÉCIFIQUE AUX TESTS
# ============================================

# Autoriser la redéfinition des beans
spring.main.allow-bean-definition-overriding=true

# Activer les uploads de fichiers pour les tests
spring.servlet.multipart.enabled=true

# Désactiver la sécurité si vous avez Spring Security
# spring.security.oauth2.client.registration=false

# ============================================
# CONFIGURATION SPÉCIFIQUE AUX TESTS
# ============================================

# Désactiver les fonctionnalités non nécessaires aux tests
spring.mail.test-connection=false

# Temps d'attente pour les tests
spring.test.database.replace=ANY

# Configuration des sessions HTTP pour les tests
server.servlet.session.timeout=30m

# Désactiver les fonctionnalités de cache
spring.cache.type=none